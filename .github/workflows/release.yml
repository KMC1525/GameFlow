name: Release

# Publique uma versão de duas formas:
#   1) criando uma tag:      git tag v0.2.0 && git push origin v0.2.0
#   2) pela aba Actions → Release → "Run workflow", informando a tag (ex.: v0.2.0) — o GitHub cria a tag
#      no commit selecionado (útil onde não é possível enviar tags).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão a publicar (ex.: v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empacotar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist && cp target/${{ matrix.target }}/release/gameflow dist/gameflow
          tar -czf gameflow-${{ matrix.target }}.tar.gz -C dist gameflow
          (command -v sha256sum >/dev/null && sha256sum gameflow-${{ matrix.target }}.tar.gz || shasum -a 256 gameflow-${{ matrix.target }}.tar.gz) > gameflow-${{ matrix.target }}.tar.gz.sha256
      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/gameflow.exe gameflow.exe
          Compress-Archive -Path gameflow.exe -DestinationPath gameflow-${{ matrix.target }}.zip
          $h = (Get-FileHash gameflow-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  gameflow-${{ matrix.target }}.zip" | Out-File -Encoding ascii gameflow-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gameflow-${{ matrix.target }}
          path: |
            gameflow-${{ matrix.target }}.tar.gz*
            gameflow-${{ matrix.target }}.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
