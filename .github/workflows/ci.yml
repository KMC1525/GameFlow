name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatação
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes
        run: cargo test --locked

  games:
    name: Jogos gerados (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe dos scripts (interface e templates)
        run: |
          for f in frontend/js/*.js templates/*/js/*.js; do node --check "$f" || exit 1; done
      - run: cargo build --locked
      - name: Instalar Playwright
        run: |
          cd scripts && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Gerar e jogar os 8 gêneros
        run: GAMEFLOW_BIN=$PWD/target/debug/gameflow NODE_PATH=$PWD/scripts/node_modules node scripts/smoke-games.js
